name: Deploy

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Lambda Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies into package directory
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --target ./package

      - name: Copy application code into package directory
        run: |
          cp -r app ./package/app
          cp lambda_handler.py ./package/lambda_handler.py
          if [ -d public ]; then
            cp -r public ./package/public
          fi

      - name: Create zip artifact
        run: |
          cd package
          zip -r ../lambda.zip .
          cd ..

      - name: Upload zip to S3
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.PROJECT_NAME }}/lambda.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    outputs:
      function_url: ${{ steps.tf_output.outputs.function_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="tf_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -var="app_env=production" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf_output
        working-directory: terraform
        run: |
          FUNCTION_URL=$(terraform output -raw function_url)
          echo "function_url=${FUNCTION_URL}" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.PROJECT_NAME }} \
            --s3-bucket ${{ secrets.TF_STATE_BUCKET }} \
            --s3-key ${{ secrets.PROJECT_NAME }}/lambda.zip \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.PROJECT_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Self-verify - health check
        run: |-
          FUNCTION_URL="${{ steps.tf_output.outputs.function_url }}"
          # Strip trailing slash if present
          FUNCTION_URL="${FUNCTION_URL%/}"
          HEALTH_URL="${FUNCTION_URL}/health"
          echo "Checking health at: ${HEALTH_URL}"
          for i in $(seq 1 5); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}")
            echo "Attempt ${i}: HTTP status ${HTTP_STATUS}"
            if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
              echo "Health check passed with status ${HTTP_STATUS}"
              exit 0
            fi
            echo "Retrying in 10 seconds..."
            sleep 10
          done
          echo "ERROR: Health check failed after 5 attempts. Last HTTP status: ${HTTP_STATUS}"
          exit 1
